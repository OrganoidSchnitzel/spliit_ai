name: Build and Publish Docker Image

# Triggers on EVERY branch push AND every published release
on:
  push:
    branches: [ "**" ]
  pull_request:
  release:
    types: [ "published" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: organoidschnitzel/spliit_ai

jobs:
  # Gate the image build on the test suite. Without this the workflow happily
  # published images from a red tree — which is exactly what it had been doing.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: test
    # Pull requests are validated by the test job but must not publish images.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Buildx
        # The default "docker" driver cannot export a build cache. This gives
        # the docker-container driver, which can.
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 1. Always tag with the branch name (e.g., :dev, :main)
            type=ref,event=branch
            # 2. If it's a release, tag with the release version (e.g., :v0.3)
            type=ref,event=tag
            # 3. ONLY update the 'latest' tag if a formal Release was published!
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
