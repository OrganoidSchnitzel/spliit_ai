services:
  spliit-ai:
    build: .
    # Or use the pre-built image:
    # image: ghcr.io/organoidschnitzel/spliit_ai:latest
    container_name: spliit-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # ── Spliit PostgreSQL connection ──────────────────────────────────────
      DB_HOST: ${DB_HOST:-spliit-postgres}   # hostname of the Spliit DB container
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-spliit}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_SSL: ${DB_SSL:-false}

      # ── Ollama (local LLM) ────────────────────────────────────────────────
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-60000}
      # Must exceed SCHEDULER_CRON's interval, or Ollama unloads the model
      # from memory between runs and re-reads it from disk every time.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-256}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}

      # ── AI behaviour ──────────────────────────────────────────────────────
      # Minimum confidence (0–1) required to auto-apply a category.
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.6}

      # Suggest and log without writing to Spliit. Worth 'true' for a first run.
      DRY_RUN: ${DRY_RUN:-false}

      # Optional shared secret for /api. Empty disables authentication.
      API_TOKEN: ${API_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # ── Scheduler ────────────────────────────────────────────────────────
      # Set to 'false' to disable automatic periodic runs.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      # Cron expression – default: every 15 minutes.
      SCHEDULER_CRON: ${SCHEDULER_CRON:-*/15 * * * *}

      # ── Processing ───────────────────────────────────────────────────────
      # Maximum number of expenses to process per scheduler run.
      BATCH_SIZE: ${BATCH_SIZE:-10}

      # Escalating wait (hours) before retrying an expense that fell below the
      # threshold. After the last step it is parked instead of retried forever.
      RETRY_BACKOFF_HOURS: ${RETRY_BACKOFF_HOURS:-1,6,24}

      # ── History ──────────────────────────────────────────────────────────
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-90}

      PORT: 3000

      # ── Ownership of the mounted data volume ─────────────────────────────
      # The container starts as root, makes /app/data writable by these ids,
      # then drops to them. Defaults are Unraid's nobody:users. Set them to the
      # owner of your host directory if it differs (`id -u` / `id -g`).
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}

    networks:
      - spliit-network
    volumes:
      - spliit-ai-data:/app/data

# ─── Attach to the existing Spliit network ────────────────────────────────────
# If Spliit and Ollama run in a different Compose project, use an external
# network (uncomment below and set the correct network name).
networks:
  spliit-network:
    external: false
    # name: spliit_default   # ← uncomment and set to your Spliit network name

volumes:
  spliit-ai-data: {}
